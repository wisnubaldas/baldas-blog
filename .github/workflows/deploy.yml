name: Deployment Serial to Vercel

on:
  push:
    branches:
      - master

jobs:
  # STEP 1: Build & Deploy Portofolio terlebih dahulu
  deploy-portfolio:
    name: 1. Deploy Portofolio (my-profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy my-profile to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_PROFILE }}
          working-directory: ./my-profile
          vercel-args: '--prod'

  # STEP 2: Build & Deploy Blog (SERIAL: Menunggu Step 1 Selesai & Sukses)
  deploy-blog:
    name: 2. Deploy Blog (blog)
    needs: deploy-portfolio  # 👈 Kunci SERIAL: Hanya jalan jika Step 1 Sukses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy blog to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_BLOG }}
          working-directory: ./blog
          vercel-args: '--prod'